name: Android APK

# Builds an installable APK on GitHub's machines, so you can install Bluesight on a phone
# without a computer. Run it from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Protocol and server tests
        run: npm test

      - name: Generate the native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: mobile/android
        # Two CPU architectures cover nearly every Android phone and halve the build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: bluesight-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Attach to the "latest-apk" release (open it on your phone to install)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          body: Test build from ${{ github.sha }}. Signed with a debug key, for testing only.
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
