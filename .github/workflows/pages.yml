name: Web (GitHub Pages)

# Publishes https://bluesight.si : the landing page (landing/) at /, and the web app at /app/
# (demo server + simulated people nearby, no backend needed).
#
# app.bluesight.si: GitHub serves one Pages domain per repo, so the app also gets pushed to a
# second repo when these are set (Settings -> Secrets and variables -> Actions):
#   variable APP_REPO          e.g. aketec-systems/bluesight-app
#   secret   APP_DEPLOY_TOKEN  fine-grained token with Contents: read & write on APP_REPO
#   variable APP_URL           https://app.bluesight.si  (where the landing page buttons point)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Protocol and server tests
        run: npm test

      - name: Export the web app
        working-directory: mobile
        env:
          EXPO_PUBLIC_DEMO: '1'
        run: npx expo export --platform web

      - name: Assemble the site
        env:
          APP_URL: ${{ vars.APP_URL || '/app/' }}
        run: |
          mkdir -p site/app app-site
          (cd mobile && node scripts/build-standalone.mjs dist ../site/app/index.html)
          cp landing/* site/
          sed -i "s|__APP_URL__|$APP_URL|g" site/index.html
          echo "bluesight.si" > site/CNAME
          touch site/.nojekyll
          cp site/app/index.html app-site/index.html
          cp site/app/index.html app-site/404.html
          echo "app.bluesight.si" > app-site/CNAME
          touch app-site/.nojekyll

      - name: Publish the app to app.bluesight.si
        if: vars.APP_REPO != ''
        env:
          TOKEN: ${{ secrets.APP_DEPLOY_TOKEN }}
          REPO: ${{ vars.APP_REPO }}
        run: |
          cd app-site
          git init -q -b gh-pages
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" commit -q -m "Deploy app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
